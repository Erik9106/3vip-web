<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 210" width="600" height="210">
  <defs>

    <!-- ── TECH PALETTE ──────────────────────────────
         Background:   #060A12  (near-black navy)
         Shield body:  #0B1220
         Primary:      #00C2FF  (electric cyan)
         Secondary:    #0066CC  (deep blue)
         Accent:       #E8F4FF  (cool silver-white)
         Dim:          #2A5080  (muted slate)
    ─────────────────────────────────────────────── -->

    <!-- Cyan-to-blue gradient for strokes & marks -->
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7EDDFF"/>
      <stop offset="40%"  stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0077DD"/>
    </linearGradient>

    <!-- Vertical gradient for wordmark -->
    <linearGradient id="wordGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E8F4FF"/>
      <stop offset="55%"  stop-color="#A8D8F0"/>
      <stop offset="100%" stop-color="#5AADDA"/>
    </linearGradient>

    <!-- Shield body subtle fill -->
    <linearGradient id="shieldBody" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%"   stop-color="#0E1828"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>

    <!-- V glow fill -->
    <linearGradient id="vGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#7EDDFF"/>
      <stop offset="100%" stop-color="#009FD4"/>
    </linearGradient>

    <!-- Shield edge glow -->
    <filter id="edgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Mark glow -->
    <filter id="markGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Wordmark glow -->
    <filter id="wordGlow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Background radial bloom -->
    <radialGradient id="bgBloom" cx="16%" cy="50%" r="28%">
      <stop offset="0%"   stop-color="#00C2FF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline texture for tech feel -->
    <pattern id="scanlines" x="0" y="0" width="1" height="3" patternUnits="userSpaceOnUse">
      <rect width="1" height="1" fill="rgba(0,194,255,0.025)"/>
    </pattern>

  </defs>

  <!-- ── Background ── -->
  <rect width="600" height="210" fill="#060A12"/>
  <rect width="600" height="210" fill="url(#bgBloom)"/>
  <rect width="600" height="210" fill="url(#scanlines)"/>

  <!-- ══════════════════════════════════════════════
       SCUTUM — centered at (88, 105)
       Width: 90  Height total: ~148
       Rectangular top, pointed oval base
  ══════════════════════════════════════════════ -->
  <g transform="translate(88, 105)">

    <!-- Shield outer glow layer -->
    <path d="M -44,-60 Q -44,-68 -36,-68 L 36,-68 Q 44,-68 44,-60
             L 44,22 Q 44,46 0,70 Q -44,46 -44,22 Z"
      fill="none" stroke="#00C2FF" stroke-width="6" opacity="0.12"
      filter="url(#edgeGlow)"/>

    <!-- Shield body -->
    <path d="M -44,-60 Q -44,-68 -36,-68 L 36,-68 Q 44,-68 44,-60
             L 44,22 Q 44,46 0,70 Q -44,46 -44,22 Z"
      fill="url(#shieldBody)"/>

    <!-- Shield main border -->
    <path d="M -44,-60 Q -44,-68 -36,-68 L 36,-68 Q 44,-68 44,-60
             L 44,22 Q 44,46 0,70 Q -44,46 -44,22 Z"
      fill="none" stroke="url(#techGrad)" stroke-width="1.8"/>

    <!-- Shield inner inset border -->
    <path d="M -36,-52 Q -36,-59 -29,-59 L 29,-59 Q 36,-59 36,-52
             L 36,18 Q 36,38 0,59 Q -36,38 -36,18 Z"
      fill="none" stroke="#00C2FF" stroke-width="0.6" opacity="0.2"/>

    <!-- Top corner accent dots -->
    <circle cx="-36" cy="-68" r="2.2" fill="#00C2FF" opacity="0.7"/>
    <circle cx=" 36" cy="-68" r="2.2" fill="#00C2FF" opacity="0.7"/>
    <!-- Bottom point accent -->
    <circle cx="0" cy="70" r="2.2" fill="#00C2FF" opacity="0.5"/>

    <!-- Thin horizontal rule — divides field into thirds -->
    <line x1="-34" y1="-17" x2="34" y2="-17"
      stroke="#00C2FF" stroke-width="0.5" opacity="0.25"/>
    <line x1="-38" y1="16" x2="38" y2="16"
      stroke="#00C2FF" stroke-width="0.5" opacity="0.15"/>

    <!-- ══════════════════════════════════════
         THREE V's distributed in the shield field
         V1: top zone    center y ≈ -38
         V2: middle zone center y ≈  0
         V3: bottom zone center y ≈ +38
         Each V: same stroke weight, same angle
         Arms span: ±13px horizontal, 22px tall
    ══════════════════════════════════════ -->

    <!-- V size helper: left arm from (cx-13, cy-11) to (cx, cy+11)
                        right arm from (cx+13, cy-11) to (cx, cy+11)
         stroke-width 5.5, round caps                               -->

    <!-- V 1 — top -->
    <line x1="-13" y1="-49" x2="0" y2="-27"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>
    <line x1=" 13" y1="-49" x2="0" y2="-27"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>

    <!-- V 2 — middle -->
    <line x1="-13" y1="-11" x2="0" y2="11"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>
    <line x1=" 13" y1="-11" x2="0" y2="11"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>

    <!-- V 3 — bottom (slightly narrower to fit the tapered shield) -->
    <line x1="-11" y1="26" x2="0" y2="46"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>
    <line x1=" 11" y1="26" x2="0" y2="46"
      stroke="url(#vGrad)" stroke-width="5.5" stroke-linecap="round"
      filter="url(#markGlow)"/>

    <!-- Subtle inner glow dots at V tips (bottom vertices) -->
    <circle cx="0" cy="-27" r="2" fill="#00C2FF" opacity="0.6"/>
    <circle cx="0" cy=" 11" r="2" fill="#00C2FF" opacity="0.5"/>
    <circle cx="0" cy=" 46" r="1.5" fill="#00C2FF" opacity="0.35"/>

  </g>

  <!-- ══════════════════════════════════════════════
       WORDMARK
  ══════════════════════════════════════════════ -->

  <!-- 3VIP -->
  <text x="162" y="112"
    font-family="'Cinzel','Trajan Pro','Times New Roman',serif"
    font-size="62" font-weight="700" letter-spacing="5"
    fill="url(#wordGrad)"
    filter="url(#wordGlow)">3VIP</text>

  <!-- Fine separator -->
  <line x1="162" y1="126" x2="562" y2="126"
    stroke="#00C2FF" stroke-width="0.5" opacity="0.25"/>

  <!-- Domain -->
  <text x="164" y="143"
    font-family="'DM Sans','Helvetica Neue',Arial,sans-serif"
    font-size="11" letter-spacing="6"
    fill="#00C2FF" opacity="0.55">3VIP.PE</text>

  <!-- Latin tagline -->
  <text x="164" y="162"
    font-family="'Cinzel','Times New Roman',serif"
    font-size="10" letter-spacing="4.5"
    fill="#5AADDA" opacity="0.5">VENI · VIDI · VICI</text>

  <!-- Descriptor -->
  <text x="164" y="180"
    font-family="'DM Sans','Helvetica Neue',Arial,sans-serif"
    font-size="8.5" letter-spacing="2.5"
    fill="#2A5080">PROPIEDAD INTELECTUAL · PERÚ</text>

</svg>
